<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iOS projects</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1b1d22; --muted: #6a7280; --line: #e2e5ea; --accent: #1f6feb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181d; --card: #1d2027; --text: #d9dde4; --muted: #8b93a1; --line: #313640; --accent: #5fb3ff; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 28px; margin: 0 0 24px; }
    a.card { display: block; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; }
    a.card strong { color: var(--accent); font-size: 19px; }
    a.card p { margin: 4px 0 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>iOS projects</h1>
    <a class="card" href="cppad/">
      <strong>cppad</strong>
      <p>Learn C++ offline on your iPad: lessons, an editor and a terminal with a real compiler.</p>
    </a>
  </main>
</body>
</html>
