name: cppad · Generate lesson

on:
  schedule:
    # Mondays and Thursdays, 10:00 UTC.
    - cron: "0 10 * * 1,4"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave blank for the next textbook section / roadmap topic)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cppad-generate-lesson
  cancel-in-progress: false

defaults:
  run:
    working-directory: cppad

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # in case the textbook is stored with Git LFS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cppad/package-lock.json
      - run: npm ci
      - id: gen
        run: node scripts/generate-lesson.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          TEXTBOOK_URL: ${{ secrets.TEXTBOOK_URL }}
      - name: Commit lesson
        env:
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          git config user.name "cppad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/
          git commit -m "cppad: add lesson: $TITLE"
          git push

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  deploy:
    needs: generate
    uses: ./.github/workflows/pages.yml
