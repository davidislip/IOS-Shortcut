name: Pages

# One GitHub Pages site for the whole repo: each web project is built into
# its own subfolder (cppad -> /cppad/), with pages/index.html at the root.

on:
  push:
    branches: [main]
    paths:
      - "cppad/**"
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # When called right after a new lesson is committed, build the new tip.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cppad/package-lock.json
      - name: Build cppad
        working-directory: cppad
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r pages/. _site/
          cp -r cppad/dist _site/cppad
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
